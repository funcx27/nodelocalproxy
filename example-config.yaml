# nodelocalproxy example config - eBPF transparent-connect mode.
#
# `mode` defaults to "userspace" (the Accept->Dial->io.Copy proxy). For
# userspace, drop the `mode`/`intercept` lines and set `listen` + `backends`:
#   listen: 127.0.0.1:6443
#   backends: [192.168.100.20:6443, ...]
#
# This example enables `ebpf-transparent`: a cgroup/connect4 BPF program rewrites
# connects to any `backends` IP:port to a healthy backend, bypassing the Go data
# path. Requires root + cgroup v2 + kernel >= 5.4 + BTF (preflight enforces);
# build with `make build`.
#
# intercept.address = the apiserver domain clients use (BPF matches `backends`,
# NOT the domain; only the port is used). Each worker resolves this domain via
# /etc/hosts or DNS to a control-plane IP listed in `backends`. Replace with your
# cluster's actual apiserver domain + control-plane IPs.

mode: ebpf-transparent

listen: 127.0.0.1:6443  # userspace only; ignored by ebpf-transparent

intercept:
  address: apiserver.example.com:6443   # apiserver host:port clients dial; port must match backend ports

backends:
  - 192.168.100.20:6443
  - 192.168.100.21:6443
  - 192.168.100.22:6443

# status + healthCheck inherit embedded defaults (unix status socket; http
# /readyz, 3s/1s, thresholds 2/1, insecureSkipVerify). Override below if needed:
# status: tcp://127.0.0.1:16444
# healthCheck:
#   failureThreshold: 3
